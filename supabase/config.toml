
[functions.create-checkout-session]
enabled = true
verify_jwt = false
import_map = "./functions/create-checkout-session/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-checkout-session/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-checkout-session/*.html" ]

[functions.stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
entrypoint = "./functions/stripe-webhook/index.ts"

[functions.create-portal-session]
enabled = true
verify_jwt = true
import_map = "./functions/create-portal-session/deno.json"
entrypoint = "./functions/create-portal-session/index.ts"

# Called by pg_cron, not a logged-in user — JWT verification is off and the
# function instead requires the service-role key in its Authorization header.
[functions.send-daily-reminders]
enabled = true
verify_jwt = false
import_map = "./functions/send-daily-reminders/deno.json"
entrypoint = "./functions/send-daily-reminders/index.ts"

# Builds an Instacart shopping-list page from a grocery list. JWT is verified
# inside the function so only signed-in users can spend our Instacart key.
[functions.create-instacart-list]
enabled = true
verify_jwt = false
import_map = "./functions/create-instacart-list/deno.json"
entrypoint = "./functions/create-instacart-list/index.ts"

# Autopilot Mode 2: weekly hands-off plan + grocery generation. Called hourly by
# pg_cron (schedule_autopilot_generation.sql) — JWT off, requires the
# service-role key in the Authorization header. Needs the GEMINI_API_KEY secret.
[functions.autopilot-generate]
enabled = true
verify_jwt = false
import_map = "./functions/autopilot-generate/deno.json"
entrypoint = "./functions/autopilot-generate/index.ts"

# Phase B lifecycle: deletes pure-professional accounts client-less for 48h.
# Called hourly by pg_cron (schedule_delete_orphaned_professionals.sql) — JWT
# off, requires the service-role key in the Authorization header.
[functions.delete-orphaned-professionals]
enabled = true
verify_jwt = false
import_map = "./functions/delete-orphaned-professionals/deno.json"
entrypoint = "./functions/delete-orphaned-professionals/index.ts"

# Phase B Chunk 3: emails a professional their client's invite code (Resend).
# JWT verified inside (so the web CORS preflight isn't blocked); the caller must
# own a pending connection with the code. Needs the RESEND_API_KEY secret.
[functions.send-invite-email]
enabled = true
verify_jwt = false
import_map = "./functions/send-invite-email/deno.json"
entrypoint = "./functions/send-invite-email/index.ts"

# Estimates per-serving recipe nutrition from an ingredient list via the USDA
# FoodData Central API. JWT verified inside (so the web CORS preflight isn't
# blocked) — only signed-in users can spend our key. Needs the USDA_API_KEY secret.
[functions.usda-nutrition]
enabled = true
verify_jwt = false
import_map = "./functions/usda-nutrition/deno.json"
entrypoint = "./functions/usda-nutrition/index.ts"
